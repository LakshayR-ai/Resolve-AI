name: CI — Resolve AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────────
  backend:
    name: Backend — Syntax & Import Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies (no torch/ML for speed)
        run: |
          pip install fastapi uvicorn pydantic[email] pydantic-settings \
            sqlalchemy python-dotenv python-jose[cryptography] passlib[bcrypt] \
            python-multipart slowapi

      - name: Syntax check — all Python files
        run: |
          python -m py_compile app.py
          python -m py_compile core/config.py core/security.py core/dependencies.py
          python -m py_compile database/database.py database/models.py
          python -m py_compile schemas/auth.py schemas/chat.py schemas/document.py schemas/analytics.py
          python -m py_compile routes/auth.py routes/chat.py routes/documents.py
          python -m py_compile routes/analytics.py routes/admin.py routes/company.py routes/widget.py
          echo "✅ All backend files pass syntax check"

  # ── Frontend ─────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
